# Real deployment config - no anonymous access, unlike the local dev broker
# (which has no auth at all). Credentials come from ./mosquitto_passwd,
# generated once with mosquitto_passwd (see README.md in this folder) -
# never hand-write a password here, mosquitto needs its own hash format.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
