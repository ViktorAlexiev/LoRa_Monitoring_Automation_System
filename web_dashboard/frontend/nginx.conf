# Serves the built React app and reverse-proxies /api/* to the web-api
# container (reached by its compose service name, not localhost - Docker's
# internal DNS resolves it). Same-origin from the browser's point of view,
# so the session cookie travels without any CORS complications in
# production (unlike local dev, where frontend:5173 and backend:8000 are
# different origins).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://web-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router client-side routes (e.g. /zones/3, /admin/users) aren't
    # real files - fall back to index.html and let the SPA's own router
    # handle the path, instead of nginx 404-ing them.
    location / {
        try_files $uri /index.html;
        # index.html names the hashed JS/CSS files of the current build, so
        # it must never be served from a browser's cache - otherwise a phone
        # keeps showing an old design after a redeploy. The hashed files in
        # /assets/ can be cached forever (their name changes with content).
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
