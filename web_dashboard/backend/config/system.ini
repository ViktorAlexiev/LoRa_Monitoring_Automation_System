; System-level infrastructure config - MQTT broker and (future) MySQL server.
; This is deliberately separate from config/defaults.json: defaults.json
; holds business placeholder values editable live from the admin panel
; (pump timing, thresholds, ...); this file holds connection settings for
; external infrastructure, edited by hand, read only by the daemons
; (reconciler.py, mqtt_bridge.py) - the web app itself never reads this file.

[mqtt]
host = localhost
port = 1883
username =
password =

[mysql]
; Not used yet - the app runs on SQLite (see app/database.py, DATABASE_URL).
; Fill these in when moving the real deployment to MySQL; nothing reads
; this section until that migration happens.
host =
port = 3306
username =
password =
database =
