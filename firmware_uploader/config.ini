[paths]
db_path = data/app.db
avrdude_path = tools/avrdude.exe
esptool_path = tools/esptool.exe
firmware_config_avr = firmware/config_avr.hex
firmware_config_esp32 = firmware/config_esp32.bin
firmware_sensor = firmware/sensor.hex
firmware_executor = firmware/executor.hex
firmware_repeater = firmware/repeater.hex
firmware_gateway = firmware/gateway.bin
firmware_pcb_config_esp32 = firmware/esp32_pcb/config_esp32.bin
firmware_pcb_sensor = firmware/esp32_pcb/sensor.bin
firmware_pcb_executor = firmware/esp32_pcb/executor.bin
firmware_pcb_executor_wifi = firmware/esp32_pcb/executor_wifi.bin
firmware_pcb_repeater = firmware/esp32_pcb/repeater.bin
firmware_pcb_gateway = firmware/esp32_pcb/gateway.bin

[serial]
baud_upload_avr = 57600
baud_upload_esp32 = 921600
baud_config_avr = 57600
baud_config_esp32 = 115200
config_timeout = 60

[platform]
board = esp32

[reserved_pins]
pins = 2,9,10,11,12,13
pins_esp32 = 5,14,18,19,26,27,21,22,6,7,8,9,10,11,34,35,36,37,38,39

[build]
arduino_cli_path = tools/arduino-cli.exe
firmware_src_dir = firmware_src/LoRa_radio_node+TTGO
avr_fqbn = arduino:avr:pro:cpu=8MHzatmega328
esp32_fqbn = esp32:esp32:ttgo-lora32
firmware_src_dir_esp32_pcb = firmware_src/ESP32_PCB(temp_hum)
esp32_pcb_fqbn = esp32:esp32:esp32

[build_targets]
config_avr = avr
config_esp32 = esp32_merged
sensor = avr
executor = avr
repeater = avr
gateway = esp32_app

[build_targets_esp32_pcb]
config_esp32 = esp32_merged
sensor = esp32_app
executor = esp32_app
executor_wifi = esp32_app
repeater = esp32_app
gateway = esp32_app

[serial_monitor]
auto_disconnect_on_tab_change = true

[lora]
freq_gateway_mhz = 433
freq_repeater_mhz = 434
extra_lanes_mhz = 434.5
sf = 7
bw_khz = 125

